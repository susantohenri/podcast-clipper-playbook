<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Podcast Clipper Video</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Fredoka:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&family=Oswald:wght@600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Press+Start+2P&family=Space+Mono:ital,wght@0,700;1,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- GSAP Animation Library -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Reusable SVG Filters for Domain Warp & Film Grain -->
  <svg data-hf-id="hf-4ps6" width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
    <defs data-hf-id="hf-mh0t">
      <filter data-hf-id="hf-zwsg" id="hf-warp-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence data-hf-id="hf-03ex" type="fractalNoise" baseFrequency="0.018 0.025" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap data-hf-id="hf-waxm" id="hf-warp-disp" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter data-hf-id="hf-nutr" id="hf-grain-filter">
        <feTurbulence data-hf-id="hf-97pi" type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch" />
        <feColorMatrix data-hf-id="hf-skw8" type="saturate" values="0" />
      </filter>
    </defs>
  </svg>

  <div data-hf-id="hf-z2vm" id="root" data-composition-id="main" data-width="1080" data-height="1920">

    <!-- Global Progress Bar -->
    <div data-hf-id="hf-azml" id="progress-wrap">
      <div data-hf-id="hf-09bk" id="progress-bar"></div>
    </div>

    <!-- Scenes Container -->
    <div data-hf-id="hf-zgq4" id="scenes-wrapper"></div>

    <!-- Captions Container -->
    <div data-hf-id="hf-vqhp" id="caption-container" class="caption-container position-lower-third">
      <div data-hf-id="hf-i061" id="speaker-badge" class="speaker-pill" style="display: none;"></div>
      <div data-hf-id="hf-uc83" id="caption-box" class="caption-box" style="display: none;">
        <div data-hf-id="hf-7di6" id="caption-line" class="caption-line"></div>
      </div>
    </div>

    <!-- Audio Wrapper (Stamped by sync.js) -->
    <div data-hf-id="hf-wffr" id="audio-wrapper">
        <audio data-hf-id="hf-tx56" id="program-audio" src="working/audio/program-audio.wav" data-start="0.00" data-duration="45.18" data-volume="1.0" data-track-index="1"></audio>
        <audio data-hf-id="hf-l20s" id="hook-sfx-1" src="assets/audio/sfx/impact-bass-1.mp3" data-start="0.00" data-volume="0.5" data-track-index="2"></audio>
        <audio data-hf-id="hf-vf65" id="hook-sfx-2" src="assets/audio/sfx/pop.mp3" data-start="4.66" data-volume="0.3" data-track-index="3"></audio>
        <audio data-hf-id="hf-t38m" id="main-sfx-1" src="assets/audio/sfx/whoosh-cinematic.mp3" data-start="5.74" data-volume="0.3" data-track-index="4"></audio>
        <audio data-hf-id="hf-hf9b" id="main-sfx-2" src="assets/audio/sfx/impact-bass-2.mp3" data-start="17.22" data-volume="0.38" data-track-index="5"></audio>
        <audio data-hf-id="hf-p2iq" id="main-sfx-3" src="assets/audio/sfx/ping.mp3" data-start="35.12" data-volume="0.24" data-track-index="6"></audio>
      </div>

  </div>

  <script src="scenes.js"></script>
  <script src="engine.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines['main'] = tl;
      if (typeof window.initPodcastComposition === 'function') {
        window.initPodcastComposition(tl);
      }
    })();
  </script>
</body>
</html>
